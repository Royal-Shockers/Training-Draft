<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brawl Stars team tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #172036; --paper: #EEF2F8; --card: #FFFFFF; --line: #D5DCE8; --muted: #5B6680;
  --blue: #1E66F5; --blue-soft: #E3ECFF; --red: #E8364D; --red-soft: #FDE5E8; --gold: #FFC53A;
  --display: "Lilita One", "Arial Black", Impact, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* beats the display rules below */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* header: the team-vs-enemy split is the one loud thing */
header { background: var(--ink); color: #fff; padding: max(14px, env(safe-area-inset-top)) 20px 0; }
.head-row { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; }
#team-name { font: 34px/1 var(--display); margin: 0; letter-spacing: .5px; text-shadow: 0 3px 0 #000; flex: 1; min-width: 200px; }
.split { height: 8px; background: linear-gradient(90deg, var(--blue) 50%, var(--red) 50%); margin: 0 -20px; }
#auth { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who { font-weight: 800; }
.who em { font-style: normal; font-weight: 600; opacity: .7; margin-left: 4px; }

.demo { background: var(--gold); color: var(--ink); padding: 8px 20px; font-weight: 600; text-align: center; }
.demo button { margin-left: 8px; }

.controls { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.controls-in { max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 14px; align-items: end; flex-wrap: wrap; }
.controls label { display: flex; flex-direction: column; font-size: 12px; font-weight: 800; color: var(--muted); }
.controls input { border: 2px solid var(--line); border-radius: 8px; padding: 5px 8px; background: #fff; }
#f-min { width: 70px; }
#f-warn { color: var(--red); font-weight: 800; font-size: 13px; }
/* top level: which part of the site you're in. Tabs below are scoped to the section. */
#sections { max-width: 1200px; margin: 0 auto; padding: 0 0 12px; display: flex; gap: 8px; overflow-x: auto; }
.sect { border: 0; background: transparent; color: #C9D2E6; font: 17px/1 var(--display); letter-spacing: .5px;
  padding: 9px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.sect:hover { color: #fff; background: rgba(255,255,255,.12); }
.sect.on { background: var(--gold); color: var(--ink); }

#tabs { max-width: 1200px; margin: 0 auto; padding: 0 20px 10px; display: flex; gap: 6px; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 800; cursor: pointer; white-space: nowrap; color: var(--muted); }
.tab:hover { background: var(--paper); color: var(--ink); }
.tab.on { background: var(--ink); color: #fff; }
.tab-team.on { background: var(--blue); }
.tab-enemy.on { background: var(--red); }

main { max-width: 1200px; margin: 0 auto; padding: 22px 20px 80px; }
h2 { font: 24px/1.15 var(--display); margin: 26px 0 12px; letter-spacing: .3px; }
main > h2:first-child, .bar h2, .side-head h2, .notice h2, .logform h2 { margin-top: 0; }
h3 { font: 20px/1.2 var(--display); margin: 0 0 10px; }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 14px; max-width: 75ch; }
.empty { color: var(--muted); padding: 24px 0; }

.btn { border: 2px solid var(--ink); border-radius: 10px; padding: 7px 16px; font-weight: 800; cursor: pointer; background: #fff; }
.btn-gold { background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.btn-gold:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn-ghost { background: transparent; border-color: var(--line); }
header .btn-ghost { color: #fff; border-color: rgba(255,255,255,.35); }
.btn-ghost:hover { border-color: var(--ink); }
.more { margin-top: 12px; }
.link { border: 0; background: none; padding: 2px 4px; font-weight: 800; color: var(--blue); cursor: pointer; }
.link.danger { color: var(--red); }
.link:disabled { color: var(--muted); opacity: .5; cursor: not-allowed; }
.file { display: inline-block; }

/* dashboard */
.record { display: grid; grid-template-columns: repeat(3, 1fr) 1.4fr; background: var(--card); border: 2px solid var(--ink); border-radius: 16px; overflow: hidden; }
.rec-num, .rec-wr { padding: 16px 20px; display: flex; flex-direction: column; }
.rec-num span, .rec-wr span { font: 56px/1 var(--display); }
.rec-num label, .rec-wr label { font-weight: 800; color: var(--muted); font-size: 13px; }
.rec-num.win span { color: var(--blue); }
.rec-num.loss span { color: var(--red); }
.rec-num.draw span { color: var(--muted); }
.rec-num + .rec-num { border-left: 1px solid var(--line); }
.rec-wr { background: var(--ink); color: var(--gold); }
.rec-wr label { color: #C9D2E6; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
.tile { background: var(--card); border-radius: 12px; padding: 12px 16px; border-left: 6px solid var(--blue); }
.tile.red { border-left-color: var(--red); }
.tile-label { font-size: 13px; font-weight: 800; color: var(--muted); }
.tile-value { font: 24px/1.2 var(--display); margin: 2px 0; }
.tile-sub { font-size: 13px; color: var(--muted); }

/* tables */
.scroll { overflow-x: auto; background: var(--card); border-radius: 12px; border: 1px solid var(--line); }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th { position: sticky; top: 0; background: var(--paper); text-align: left; padding: 0; border-bottom: 2px solid var(--line); white-space: nowrap; }
.tbl th button { border: 0; background: none; padding: 9px 10px; font-weight: 800; cursor: pointer; width: 100%; text-align: inherit; }
.tbl th.num { text-align: right; }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.matches th, .plain th { padding: 9px 10px; }   /* headers with no sort button get no padding otherwise */
.plain td.pos, .plain th:first-child { width: 48px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; margin: 1px 3px 1px 0; }
.chip.blue { background: var(--blue-soft); color: #10398F; }
.chip.red { background: var(--red-soft); color: #8F1426; }
.res { font-weight: 800; padding: 2px 8px; border-radius: 6px; }
.res-W { background: var(--blue); color: #fff; }
.res-L { background: var(--red); color: #fff; }
.res-D { background: var(--line); }
.acts { text-align: right; }

.bar, .side-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.bar-acts { display: flex; gap: 8px; }
.side-head h2 { padding-left: 12px; border-left: 6px solid var(--blue); }
.side-head.enemy h2 { border-left-color: var(--red); }
.toggle { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.subtabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 6px; }
.subtab { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.subtab.on { border-color: var(--ink); background: var(--ink); color: #fff; }
.search { width: min(360px, 100%); border: 2px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; }

.matrix-wrap { max-height: 75vh; }
.matrix { border-collapse: separate; border-spacing: 0; font-size: 13px; }
.matrix th, .matrix td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.matrix thead th { position: sticky; top: 0; background: var(--paper); z-index: 2; font-weight: 800; padding: 6px; }
.matrix th.rot { height: 130px; vertical-align: bottom; }
.matrix th.rot span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
.matrix tbody th { position: sticky; left: 0; background: var(--card); text-align: left; padding: 4px 10px; white-space: nowrap; z-index: 1; }
.matrix .corner { left: 0; z-index: 3; text-align: left; vertical-align: bottom; }
.matrix td { min-width: 48px; text-align: center; padding: 4px; font-variant-numeric: tabular-nums; }

/* log form */
.logform { background: var(--card); border-radius: 16px; padding: 20px; border: 2px solid var(--ink); max-width: 920px; }
.logform label { display: flex; flex-direction: column; font-weight: 800; font-size: 13px; color: var(--muted); gap: 4px; }
.logform input, .logform select { border: 2px solid var(--line); border-radius: 8px; padding: 8px; background: #fff; color: var(--ink); font-weight: 600; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 12px; }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; margin-top: 16px; align-items: start; }
fieldset { border: 0; margin: 0; padding: 0; }
legend { font: 18px/1 var(--display); margin-bottom: 8px; }
.team { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; }
.team.blue { background: var(--blue-soft); }
.team.red { background: var(--red-soft); }
.team.blue legend { color: var(--blue); }
.team.red legend { color: var(--red); }
.team legend { float: left; width: 100%; }
.result { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; min-width: 110px; }
.result legend { float: left; width: 100%; text-align: center; }
.resbtn { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 9px; font-weight: 800; cursor: pointer; }
.resbtn.on.rb-W { background: var(--blue); border-color: var(--blue); color: #fff; }
.resbtn.on.rb-L { background: var(--red); border-color: var(--red); color: #fff; }
.resbtn.on.rb-D { background: var(--ink); border-color: var(--ink); color: #fff; }
.formacts { display: flex; gap: 10px; margin-top: 18px; }

/* lists */
.panels { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 14px; align-items: start; }
.panel { background: var(--card); border-radius: 12px; padding: 14px; border: 1px solid var(--line); }
.count { font: 600 14px var(--body); color: var(--muted); }
.addrow { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.addrow input, .addrow select { flex: 1; min-width: 120px; border: 2px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.items { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow-y: auto; }
.items li { display: flex; gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--paper); }
.items input { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; background: transparent; }
.items input:hover:not(:disabled), .items input:focus { border-color: var(--line); background: #fff; }
.items select { border: 1px solid var(--line); border-radius: 6px; padding: 3px; max-width: 120px; }
.members li span { flex: 1; padding: 6px 0; }

.notice { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 22px; max-width: 560px; }
.notice code { background: var(--paper); border-radius: 4px; padding: 1px 5px; font-size: 13px; }

/* players (live API) */
.tagform { max-width: 420px; }
.tagform input { text-transform: uppercase; }
.tagchips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; align-items: center; }
.tagchip { display: inline-flex; align-items: center; gap: 2px; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 2px 6px 2px 4px; }
.tagchip.on { border-color: var(--ink); }
.tagchip .link { color: var(--ink); }
.tagchip.on .link { color: var(--blue); }
.phead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 18px 0 12px; }
.phead h2 { margin: 0; }
.ptag { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.star { color: var(--gold); text-shadow: 0 0 1px #8a6a00; }
.session { margin-bottom: 18px; }
.session-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.session-head h3 { margin: 0; }
.session-sum { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; font-weight: 800; color: var(--muted); }
.session-sum .up { color: #17803D; }
.session-sum .down { color: var(--red); }
/* ranked ladder — a dark leaderboard panel, in the style of the ranked trackers */
.lb { --lb-bg: #0D1117; --lb-card: #161B22; --lb-line: #232A35; --lb-dim: #8B95A5; --lb-text: #E6EDF3;
  background: var(--lb-bg); color: var(--lb-text); border-radius: 16px; overflow: hidden; border: 1px solid var(--lb-line); }
.lb-head { padding: 22px 24px 16px; }
.lb-head h2 { font: 30px/1 var(--display); margin: 0 0 6px; color: #fff; letter-spacing: .4px; }
.lb-sub { margin: 0 0 14px; color: var(--lb-dim); font-size: 14px; }
.lb-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.lb-pill { border: 0; background: #20262F; color: var(--lb-text); border-radius: 999px;
  padding: 8px 15px; font-weight: 700; font-size: 14px; cursor: pointer; }
.lb-pill span { color: var(--lb-dim); margin-left: 5px; font-variant-numeric: tabular-nums; }
.lb-pill:hover { background: #2A313C; }
.lb-pill.on { background: #7C4DFF; color: #fff; }
.lb-pill.on span { color: rgba(255,255,255,.75); }

.lb-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.lb-table th { text-align: left; padding: 14px 16px; color: var(--lb-dim); font-weight: 700; font-size: 14px;
  border-top: 1px solid var(--lb-line); border-bottom: 1px solid var(--lb-line); white-space: nowrap; }
.lb-table td { padding: 13px 16px; border-bottom: 1px solid var(--lb-line); vertical-align: middle; }
.lb-table tbody tr:last-child td { border-bottom: 0; }
.lb-table tbody tr:hover { background: var(--lb-card); }
.lb-pos { width: 56px; color: var(--lb-dim); font-variant-numeric: tabular-nums; }
.lb-name { border: 0; background: none; padding: 0; color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; }
.lb-name:hover { text-decoration: underline; }
.lb-tag { color: #5E6773; font-size: 13px; margin-left: 7px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.lb-tier { font-size: 13px; font-weight: 700; margin-top: 2px; }
.lb-elo, .lb-num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lb-num { color: var(--lb-dim); }
.lb-club { color: var(--lb-dim); font-size: 14px; }
.lb-badge { display: inline-block; min-width: 76px; text-align: center; padding: 6px 12px; border-radius: 8px;
  font-weight: 800; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  background: rgba(255,197,58,.12); border: 1px solid rgba(255,197,58,.45); color: #FFD76B; }
/* tier colours: Pro green, Masters gold, Legendary purple, Mythic blue */
.f-pro { color: #3FB950; } .lb-badge.f-pro { background: rgba(63,185,80,.12); border-color: rgba(63,185,80,.45); }
.f-masters { color: #E3B341; } .lb-badge.f-masters { background: rgba(227,179,65,.12); border-color: rgba(227,179,65,.45); }
.f-legendary { color: #BC8CFF; } .lb-badge.f-legendary { background: rgba(188,140,255,.12); border-color: rgba(188,140,255,.45); }
.f-mythic { color: #58A6FF; } .lb-badge.f-mythic { background: rgba(88,166,255,.12); border-color: rgba(88,166,255,.45); }
.f-other { color: var(--lb-dim); }
.lb-empty { padding: 34px 24px; color: var(--lb-dim); border-top: 1px solid var(--lb-line); margin: 0; }
.lb-more { display: block; width: 100%; border: 0; border-top: 1px solid var(--lb-line); background: transparent;
  color: var(--lb-text); padding: 15px; font-weight: 700; cursor: pointer; }
.lb-more:hover { background: var(--lb-card); }
@media (max-width: 640px) {
  .lb-table { font-size: 14px; display: block; overflow-x: auto; }
  .lb-head { padding: 18px 16px 14px; }
  .lb-table th, .lb-table td { padding: 11px 12px; }
  .lb-club { display: none; }
  .lb-table th.lb-club { display: none; }
}
/* ping check — rows in the style of the ping trackers, on a dark panel */
.pg { --pg-bg: #1B1340; --pg-row: #241A52; --pg-line: #32266B; --pg-dim: #B4A8E8;
  background: var(--pg-bg); color: #fff; border-radius: 16px; padding: 20px; border: 1px solid var(--pg-line); }
.pg-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.pg-head h2 { font: 28px/1 var(--display); margin: 0; color: #fff; }
.pg-sub { margin: 0; color: var(--pg-dim); font-size: 14px; flex: 1; min-width: 180px; }
.pg-sub strong { color: #fff; }
.pg-group { font: 15px/1 var(--display); color: var(--pg-dim); margin: 18px 0 8px; letter-spacing: .6px; }
.pg-group:first-of-type { margin-top: 0; }
.pg-row { display: flex; align-items: center; gap: 12px; background: var(--pg-row); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 8px; overflow: hidden; }
.pg-best { outline: 2px solid var(--gold); }
.pg-bar { width: 5px; align-self: stretch; border-radius: 3px; flex: none; margin: -2px 0; }
.pg-label { font: 17px/1.2 var(--display); letter-spacing: .4px; flex: 1; min-width: 0; }
.pg-label em { font-style: normal; color: var(--pg-dim); margin: 0 2px; }
.pg-city { color: var(--pg-dim); }
.pg-via { font-size: 12px; font-weight: 700; color: var(--pg-dim); background: rgba(255,255,255,.08);
  padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.pg-ms { font: 17px/1 var(--display); min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
.pg-dot { width: 15px; height: 15px; border-radius: 50%; flex: none; }
.d-good { background: #3FB950; box-shadow: 0 0 8px #3FB95099; }
.d-ok { background: #FFD60A; box-shadow: 0 0 8px #FFD60A99; }
.d-poor { background: #F0883E; box-shadow: 0 0 8px #F0883E99; }
.d-bad { background: #E8364D; box-shadow: 0 0 8px #E8364D99; }
.d-none { background: #4B3F7A; }
.d-wait { background: #4B3F7A; animation: pgpulse 1s ease-in-out infinite; }
@keyframes pgpulse { 50% { opacity: .35; } }
.pg-note { color: var(--pg-dim); margin: 0; }
@media (max-width: 560px) {
  .pg { padding: 14px; }
  .pg-label { font-size: 15px; }
  .pg-city { display: block; font-size: 13px; }
  .pg-via { display: none; }
}
@media (prefers-reduced-motion: reduce) { .d-wait { animation: none; } }
.bwrap { display: inline-flex; align-items: center; gap: 7px; }
.bimg { width: 28px; height: 28px; border-radius: 6px; background: var(--paper); object-fit: cover; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 140%); background: var(--ink); color: #fff;
  padding: 10px 18px; border-radius: 10px; font-weight: 800; max-width: calc(100% - 32px); transition: transform .2s, opacity .2s; z-index: 20; opacity: 0; pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.bad { background: var(--red); }

@media (max-width: 860px) {
  .controls { position: static; }
  .record { grid-template-columns: repeat(3, 1fr); }
  .rec-wr { grid-column: 1 / -1; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .panels { grid-template-columns: 1fr; }
  .row3 { grid-template-columns: 1fr 1fr; }
  .row3 label:last-child { grid-column: 1 / -1; }
  .teams { grid-template-columns: 1fr; }
  .result { flex-direction: row; flex-wrap: wrap; padding: 0; }
  .result legend { text-align: left; }
  .resbtn { flex: 1; }
}
@media (max-width: 520px) {
  #team-name { font-size: 28px; }
  .rec-num span, .rec-wr span { font-size: 40px; }
  .tiles { grid-template-columns: 1fr; }
  main { padding: 16px 12px 80px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1 id="team-name">Team tracker</h1>
    <div id="auth"></div>
  </div>
  <nav id="sections" aria-label="Sections"></nav>
  <div class="split" aria-hidden="true"></div>
</header>
<div class="demo" id="demo-banner" hidden>
  Demo mode: games are only saved in this browser. Follow the README to connect your database.
  <button class="btn btn-ghost" data-act="resetdemo">Reset demo</button>
</div>
<div class="controls">
  <div class="controls-in">
    <label>From <input type="date" id="f-from"></label>
    <label>To <input type="date" id="f-to"></label>
    <label>Min games <input type="number" id="f-min" min="0" step="1"></label>
    <button class="btn btn-ghost" id="f-clear" type="button">All dates</button>
    <span id="f-warn" role="status"></span>
  </div>
